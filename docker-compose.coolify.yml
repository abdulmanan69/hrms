# Coolify deployment.
#   New Resource → Public Repository → https://github.com/abdulmanan69/hrms
#   Build Pack: Docker Compose, Docker Compose Location: /docker-compose.coolify.yml
#   Domain on the `web` service, e.g. https://hr.example.com
#
# Coolify's proxy terminates HTTPS and routes the domain to the `web`
# service's port 80; nothing here publishes a host port, and there is no
# .env file: every ${VARIABLE} below appears in Coolify's Environment
# Variables tab. Required before the first start: ADMIN_PASSWORD (the super
# admin's first password; change it after signing in). The Postgres password
# is generated by Coolify.

x-logging: &logging
  driver: json-file
  options: { max-size: "20m", max-file: "5" }

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-hrms}
      POSTGRES_USER: ${POSTGRES_USER:-hrms}
      POSTGRES_PASSWORD: ${SERVICE_PASSWORD_POSTGRES}
      TZ: Asia/Karachi
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-hrms} -d ${POSTGRES_DB:-hrms}"]
      interval: 5s
      timeout: 3s
      retries: 20
    logging: *logging

  api:
    build: ./server
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_PORT: "8080"
      DATABASE_URL: postgres://${POSTGRES_USER:-hrms}:${SERVICE_PASSWORD_POSTGRES}@postgres:5432/${POSTGRES_DB:-hrms}
      UPLOAD_DIR: /data/uploads
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-12}
      # false = automatic: the cookie is Secure whenever the site is served over HTTPS
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      COMPANY_NAME: ${COMPANY_NAME:-WaveTech}
      COMPANY_SLUG: ${COMPANY_SLUG:-wavetech}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@wavetech.pk}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      DB_POOL_MAX: ${DB_POOL_MAX:-10}
      WEBHOOK_ALLOW_PRIVATE: ${WEBHOOK_ALLOW_PRIVATE:-false}
      # Coolify's proxy, then the bundled nginx
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-2}
      SEED_DEMO: ${SEED_DEMO:-false}
      UPLOAD_MAX_MB: ${UPLOAD_MAX_MB:-10}
      TZ_BUSINESS: ${TZ_BUSINESS:-Asia/Karachi}
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - uploads:/data/uploads
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/healthz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    logging: *logging

  web:
    build: ./web
    restart: unless-stopped
    environment:
      # tells Coolify this is the public service, on container port 80
      - SERVICE_FQDN_WEB_80
    expose:
      - "80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/healthz"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 15s
    logging: *logging

volumes:
  pgdata:
  uploads:
